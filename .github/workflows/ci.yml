name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify repository hygiene
        run: python -m unittest tests.test_repo_hygiene -v

      # Tests call the engine in-process, so the CLI's console reconfiguration
      # does not run; Windows runners default to cp1252. The CLI path itself is
      # checked without this override in the CP936 step below.
      - name: Run unit test suite
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v

      - name: Validate minimal demo plan and CLI
        run: |
          python synthesize.py --plan --source examples/minimal-demo
          python smoke_test.py --help

      - name: Build package metadata and wheel
        run: python -m pip wheel --no-deps -w dist .

      - name: Validate doctor check exit code
        run: |
          python -c "import subprocess, sys; res = subprocess.run([sys.executable, 'synthesize.py', '--doctor', '--source', 'examples/minimal-demo']); assert res.returncode in (0, 2), f'Expected doctor exit code 0 or 2, got {res.returncode}'"

      - name: Test Windows console encoding resiliency (CP936)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          chcp 936
          set PYTHONIOENCODING=
          python synthesize.py --plan --source examples/minimal-demo
          python -m unittest tests.test_console_encoding -v
