[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "document-synthesis"
version = "0.2.0"
description = "Multi-source document typesetting, assembly, and verified delivery pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Document Synthesis Maintainers" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "python-docx>=1.1.0",
    "pymupdf>=1.24.0",
    "pypdf>=4.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "lxml>=4.9.0",
    "jsonschema>=4.18.0,<5.0.0",
    "pywin32>=306; sys_platform == 'win32'",
]

# 代码通过仓库相对路径读取 schemas/、formats/ 等资源，目前只支持从仓库克隆中
# 安装依赖或使用 `pip install -e .`。可分发的 wheel（资源打包与包名整理）在 P8 处理。
[tool.setuptools]
packages = ["lib", "lib.office"]
py-modules = ["synthesize", "smoke_test"]
